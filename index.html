<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game Load</title>
<meta name="description" content="Live minutes, stints and rotation tracker for basketball. Works offline; data stays on the device.">
<meta name="theme-color" content="#070707">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Load">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>
<style>
:root{
  color-scheme:dark;
  --bg:#070707; --panel:#131313; --panel2:#1b1b1b; --panel3:#232323; --line:#2c2c2c; --line2:#3a3a3a;
  --red:#e4032e; --red-dim:rgba(228,3,46,.16); --red-line:rgba(228,3,46,.55);
  --green:#34d399; --green-dim:rgba(52,211,153,.14); --green-line:rgba(52,211,153,.55);
  --amber:#f2c94c; --orange:#f2994a; --purple:#b48cf2; --blue:#60a5fa;
  --text:#f5f5f3; --muted:#9a9592; --muted2:#6b6764;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);}
#root{height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; overscroll-behavior:none; touch-action:manipulation; font-size:15px;}
button{font-family:inherit; cursor:pointer; border:none; color:inherit; background:none; touch-action:manipulation;}
button:disabled{opacity:.35; cursor:not-allowed;}
input,select,textarea{font-family:inherit; font-size:16px; color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; width:100%;}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--red-line);}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums;}
.muted{color:var(--muted);}
.hidden{display:none !important;}

/* ---------- generic pages ---------- */
.page{min-height:100%; max-width:900px; margin:0 auto; padding:calc(14px + var(--safe-t)) 18px calc(30px + var(--safe-b));}
.topbar{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
.topbar h1{font-size:22px; margin:0; flex:1; letter-spacing:.01em;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-dot{width:12px; height:12px; border-radius:3px; background:var(--red); box-shadow:0 0 14px rgba(228,3,46,.6);}
.card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px;}
.card h2{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 12px; font-weight:700;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 18px; border-radius:11px; font-weight:700; font-size:15px; background:var(--panel2); border:1px solid var(--line); min-height:46px;}
.btn.primary{background:var(--red); border-color:var(--red); color:#fff;}
.btn.green{background:var(--green); border-color:var(--green); color:#062218;}
.btn.ghost{background:transparent;}
.btn.danger{color:#ff6b81; border-color:rgba(255,107,129,.4);}
.btn.small{padding:8px 12px; min-height:36px; font-size:13px; border-radius:9px;}
.btn.block{width:100%;}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
.field label{display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:6px;}
.seg{display:flex; background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:3px; gap:3px;}
.seg button{flex:1; padding:10px 8px; border-radius:8px; font-weight:700; font-size:14px; color:var(--muted);}
.seg button.on{background:var(--red); color:#fff;}
.list-item{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line);}
.list-item:last-child{border-bottom:none;}
.pill{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; background:var(--panel3); color:var(--muted);}
.pill.live{background:var(--green-dim); color:var(--green);}
.pill.warn{background:rgba(242,153,74,.15); color:var(--orange);}
.pill.red{background:var(--red-dim); color:#ff6b81;}
.note{font-size:13px; color:var(--muted); line-height:1.45;}
.cloud-ok{color:var(--green)} .cloud-error,.cloud-offline{color:var(--orange)}
.warnbox{background:rgba(242,153,74,.1); border:1px solid rgba(242,153,74,.4); color:#f6c99c; border-radius:11px; padding:10px 12px; font-size:13.5px; line-height:1.4; margin-bottom:12px;}
table.t{width:100%; border-collapse:collapse; font-size:13.5px;}
table.t th{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); font-weight:700; white-space:nowrap;}
table.t td{padding:9px 6px; border-bottom:1px solid var(--line); white-space:nowrap;}
table.t td.num, table.t th.num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums;}
table.t tr:last-child td{border-bottom:none;}
.tscroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
.band{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:middle;}

/* ---------- player pick (new game) ---------- */
.pick-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
.pick{position:relative; background:var(--panel2); border:2px solid var(--line); border-radius:13px; padding:12px; text-align:left; min-height:84px;}
.pick .n{font-family:var(--mono); color:var(--muted); font-size:13px;}
.pick .nm{font-size:17px; font-weight:800; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pick.off{opacity:.38;}
.pick.dressed{border-color:var(--line2);}
.pick.starter{border-color:var(--green); background:var(--green-dim);}
.pick .star{position:absolute; top:8px; right:8px; width:40px; height:40px; border-radius:10px; font-size:20px; display:flex; align-items:center; justify-content:center; background:var(--panel3); color:var(--muted2);}
.pick.starter .star{background:var(--green); color:#062218;}

/* ---------- LIVE ---------- */
#live{display:flex; flex-direction:column; height:100%; height:100dvh; max-width:1100px; margin:0 auto; overflow:hidden;}
.lv-top{flex:0 0 auto; padding:calc(8px + var(--safe-t)) 12px 0;}
.lv-head{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px;}
.lv-left{display:flex; align-items:center; gap:8px;}
.iconbtn{width:46px; height:46px; border-radius:12px; background:var(--panel2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:20px;}
.period{min-width:58px; height:46px; padding:0 10px; border-radius:12px; background:var(--red); color:#fff; font-weight:900; font-size:20px; display:flex; align-items:center; justify-content:center;}
.lv-center{display:flex; align-items:center; justify-content:center; gap:16px;}
.runbtn{width:52px; height:52px; border-radius:14px; background:var(--green); color:#062218; font-size:20px; font-weight:900; flex-shrink:0;}
.runbtn.on{background:var(--panel2); color:var(--green); border:2px solid var(--green);}
.clockbtn{display:flex; flex-direction:column; align-items:center; padding:2px 12px; border-radius:12px;}
.clockbtn .ck{font-family:var(--mono); font-size:44px; font-weight:800; line-height:1; letter-spacing:-.01em;}
.clockbtn .ckl{font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-top:3px; font-weight:700;}
.scorebtn{display:flex; flex-direction:column; align-items:center; padding:4px 12px; border-radius:12px; background:var(--panel); border:1px solid var(--line);}
.scorebtn .sc{white-space:nowrap; font-family:var(--mono); font-size:30px; font-weight:800; line-height:1.05;}
.scorebtn .scl{font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:700;}
.lv-right{display:flex; align-items:center; gap:8px;}
.undo{height:46px; padding:0 16px; border-radius:12px; background:var(--panel2); border:1px solid var(--line); font-weight:800; font-size:15px;}
.lv-sub{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px;}
.possrow{display:grid; grid-template-columns:1fr auto 1fr; gap:8px; margin-top:8px; align-items:center;}
.possbtn{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none; position:relative; overflow:hidden;}
.possbtn.pressing::after{content:""; position:absolute; left:0; bottom:0; height:4px; background:var(--orange); animation:lp .6s linear forwards;}
@keyframes lp{from{width:0} to{width:100%}}
.possbtn{height:50px; border-radius:12px; font-weight:900; font-size:15px; letter-spacing:.04em; display:flex; align-items:center; justify-content:center; gap:10px; border:2px solid var(--line);}
.possbtn.us{background:rgba(96,165,250,.12); border-color:rgba(96,165,250,.5); color:var(--blue);}
.possbtn.them{background:var(--panel2); color:var(--text);}
.possbtn.last{box-shadow:0 0 0 3px rgba(96,165,250,.35) inset;}
.possbtn.them.last{box-shadow:0 0 0 3px rgba(245,245,243,.25) inset;}
.possbtn .pc{font-family:var(--mono); font-size:18px;}
.possmid{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:800; text-align:center; line-height:1.3;}
.ptsgrp{display:flex; align-items:center; gap:6px;}
.ptsgrp .lbl{font-size:11px; font-weight:800; letter-spacing:.1em; color:var(--muted); width:42px; text-align:right;}
.pts{width:58px; height:44px; border-radius:11px; font-weight:900; font-size:17px; background:var(--panel2); border:1px solid var(--line);}
.pts.us{background:var(--green-dim); border-color:rgba(52,211,153,.35); color:var(--green);}
.tf{display:flex; flex-direction:column; align-items:center; min-width:96px;}
.tf .v{font-family:var(--mono); font-size:20px; font-weight:800;}
.tf .l{font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:700;}
.tf.warn .v{color:var(--orange);} .tf.bonus .v{color:var(--red);}
.status{height:34px; margin-top:8px; border-radius:10px; background:var(--panel); border:1px solid var(--line); display:flex; align-items:center; padding:0 12px; font-size:14px; font-weight:600; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
.status.info{color:var(--muted);} .status.ok{color:var(--green); border-color:rgba(52,211,153,.35);} .status.warn{color:var(--orange); border-color:rgba(242,153,74,.45);} .status.alert{color:#fff; background:var(--red-dim); border-color:var(--red-line);}
.status span{overflow:hidden; text-overflow:ellipsis;}
.zone-label{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:800; margin:10px 2px 6px; display:flex; justify-content:space-between;}
.tiles{display:grid; grid-template-columns:repeat(5,1fr); gap:8px;}
.tile{position:relative; border-radius:14px; background:var(--panel); border:2px solid var(--line); padding:9px 9px 8px; text-align:left; overflow:hidden; display:flex; flex-direction:column; min-width:0;}
.tile.court{height:152px; border-color:rgba(52,211,153,.45); background:linear-gradient(180deg,rgba(52,211,153,.10),rgba(52,211,153,.02));}
.tile.bench{height:112px;}
.t-rest{font-family:var(--mono); font-size:12px; color:var(--blue); margin-top:2px;}
.tile.sel-out{border-color:var(--red); box-shadow:0 0 0 3px rgba(228,3,46,.35) inset; background:var(--red-dim);}
.tile.sel-in{border-color:var(--green); box-shadow:0 0 0 3px rgba(52,211,153,.35) inset; background:var(--green-dim);}
.tile.out5{opacity:.45;}
.tile .tag{position:absolute; top:7px; right:7px; font-size:10.5px; font-weight:900; letter-spacing:.06em; padding:3px 7px; border-radius:6px;}
.tile .tag.o{background:var(--red); color:#fff;} .tile .tag.i{background:var(--green); color:#062218;}
.t-top{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); font-family:var(--mono);}
.t-top .ps{font-family:inherit; font-size:10px; font-weight:800; padding:1px 5px; border-radius:4px; background:var(--panel3);}
.t-top .st{color:var(--amber); font-size:12px;}
.t-name{font-size:17px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; padding-right:2px;}
.t-stint{font-family:var(--mono); font-size:27px; font-weight:800; line-height:1.05; margin-top:4px;}
.qx{display:inline-block; font-family:-apple-system,sans-serif; font-size:11px; font-weight:900; color:#fff; background:var(--purple); border-radius:5px; padding:2px 5px; margin-left:6px; vertical-align:middle; letter-spacing:.02em;}
.t-stint.fresh{color:var(--green);} .t-stint.watch{color:var(--amber);} .t-stint.high{color:#ff4d6a;}
.t-tot{font-family:var(--mono); font-size:12.5px; color:var(--muted); margin-top:2px; display:flex; gap:8px; align-items:center;}
.t-tot b{color:var(--text);}
.t-bar{height:4px; border-radius:2px; background:var(--panel3); margin-top:5px; overflow:hidden; width:calc(100% - 50px);}
.t-bar i{display:block; height:100%; background:var(--green);}
.t-bottom{margin-top:auto; display:flex; align-items:flex-end; justify-content:space-between; gap:4px;}
.fdots{display:flex; gap:3px;}
.fdots i{width:9px; height:9px; border-radius:50%; background:var(--panel3); border:1px solid var(--line2);}
.fdots i.on{background:var(--amber); border-color:var(--amber);}
.fdots.trouble i.on{background:var(--orange); border-color:var(--orange);}
.fdots.out i.on{background:var(--red); border-color:var(--red);}
.fbtn{position:absolute; right:6px; bottom:6px; width:46px; height:40px; border-radius:10px; background:rgba(242,153,74,.12); border:1px solid rgba(242,153,74,.45); color:var(--orange); font-weight:900; font-size:15px;}
.pm{font-family:var(--mono); font-size:12px; font-weight:800;}
.pm.pos{color:var(--green);} .pm.neg{color:#ff6b81;} .pm.zero{color:var(--muted);}
.actions{display:grid; grid-template-columns:1fr 2fr 1.2fr 1fr; gap:8px; margin-top:10px;}
.actions .btn{min-height:56px; font-size:16px;}
.subbtn{background:var(--panel2); border:1px solid var(--line);}
.subbtn.ready{background:var(--green); border-color:var(--green); color:#062218;}
.lv-panel{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px 12px calc(20px + var(--safe-b)); margin-top:10px; border-top:1px solid var(--line);}
.viewtabs{display:flex; gap:6px; margin-bottom:10px;}
.viewtabs button{padding:8px 14px; border-radius:20px; font-weight:800; font-size:13px; background:var(--panel2); border:1px solid var(--line); color:var(--muted);}
.viewtabs button.on{background:var(--text); color:#000; border-color:var(--text);}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:8px; margin-bottom:10px;}
.kpi{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px;}
.kpi .v{font-family:var(--mono); font-size:22px; font-weight:800;}
.kpi .l{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-top:2px;}
.kpi.warn .v{color:var(--orange);} .kpi.alert .v{color:#ff4d6a;}
.tl{position:relative;}
.tl-row{display:flex; align-items:center; gap:8px; height:24px; margin-bottom:4px;}
.tl-name{width:96px; flex-shrink:0; font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:right;}
.tl-track{position:relative; flex:1; height:20px; background:var(--panel2); border-radius:4px;}
.tl-seg{position:absolute; top:0; bottom:0; background:var(--green); border-radius:3px; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:10px; font-weight:800; color:#062218; overflow:hidden; white-space:nowrap; font-style:normal;}
.tl-seg.watch{background:var(--amber);} .tl-seg.high{background:#ff4d6a; color:#fff;}
.tl-seg.open{background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.18) 0 5px,transparent 5px 10px);}
.tl-div{position:absolute; top:-2px; bottom:-2px; width:1px; background:var(--muted2);}
.tl-div.half{width:3px; margin-left:-1px; background:var(--text);}
.tl-now{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--red);}
.tl-x{position:absolute; top:-4px; width:9px; height:9px; margin-left:-4.5px; background:var(--purple); transform:rotate(45deg); border:1px solid var(--bg);}
.tl-f{position:absolute; bottom:-3px; width:8px; height:8px; margin-left:-4px; border-radius:50%; background:var(--orange); border:1px solid var(--bg);}
.tl-tot{width:46px; text-align:right; font-family:var(--mono); font-size:12px; color:var(--muted);}
.tl-axis{display:flex; gap:8px; margin-bottom:6px;}
.tl-axis .sp{width:96px; flex-shrink:0;}
.tl-axis .ax{position:relative; flex:1; height:16px; font-size:11px; color:var(--muted); font-weight:800;}
.tl-axis .ax span{position:absolute; text-align:center; white-space:nowrap;}
.tl-axis .ax em{font-style:normal; font-family:var(--mono); font-weight:600; color:var(--muted2); margin-left:4px;}
.tl-axis .sp2{width:46px;}
.tl-legend{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; font-size:11.5px; color:var(--muted);}
.tl-legend span{display:flex; align-items:center; gap:6px;}
.tl-legend .lg{display:inline-block; width:14px; height:10px; border-radius:2px;}
.tl-legend .lg.x{width:9px; height:9px; background:var(--purple); transform:rotate(45deg);}
.tl-legend .lg.f{width:8px; height:8px; border-radius:50%; background:var(--orange);}
.tl-legend .lg.h{width:3px; height:12px; background:var(--text);}
.loglist .li{display:flex; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
.loglist .li .tm{font-family:var(--mono); color:var(--muted); min-width:74px;}

/* ---------- modal / keypad ---------- */
.ov{position:fixed; inset:0; background:rgba(0,0,0,.72); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;}
.modal{background:var(--panel); border:1px solid var(--line2); border-radius:18px; width:100%; max-width:520px; max-height:94vh; overflow-y:auto; padding:18px;}
.modal h3{margin:0 0 4px; font-size:18px;}
.modal .sub{font-size:13.5px; color:var(--muted); margin-bottom:12px; line-height:1.4;}
.swap{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:12px; font-weight:800;}
.swap .o{background:var(--red-dim); color:#ff6b81; border:1px solid var(--red-line); padding:5px 10px; border-radius:8px;}
.swap .i{background:var(--green-dim); color:var(--green); border:1px solid var(--green-line); padding:5px 10px; border-radius:8px;}
.fld{border:2px solid var(--line); border-radius:13px; background:var(--panel2); padding:8px 12px; margin-bottom:10px; text-align:left; width:100%; display:block;}
.fld.act{border-color:var(--red);}
.fld .fl{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:800;}
.fld .fv{font-family:var(--mono); font-size:34px; font-weight:800; line-height:1.15;}
.fld .fv.ph{color:var(--muted2);}
.scorepair{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.qinc{display:flex; gap:5px; margin:-4px 0 10px;}
.qinc button{flex:1; height:38px; border-radius:9px; background:var(--panel3); border:1px solid var(--line); font-weight:800;}
.pad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:4px;}
.pad button{height:58px; border-radius:12px; background:var(--panel3); border:1px solid var(--line); font-family:var(--mono); font-size:24px; font-weight:800;}
.merr{min-height:20px; color:#ff6b81; font-size:13.5px; font-weight:600; margin:8px 0 2px;}
.mact{display:flex; gap:8px; margin-top:8px;}
.mact .btn{flex:1; min-height:54px; font-size:16px;}
/* report (screen) */
.rp-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px;}
.rp-t{font-size:22px; font-weight:900;}
.rp-score{font-family:var(--mono); font-size:34px; font-weight:900; white-space:nowrap;}
.rp-score.w{color:var(--green);} .rp-score.l{color:#ff6b81;}
.rp-score span{font-size:12px; margin-left:8px; vertical-align:middle; padding:3px 7px; border-radius:6px; background:var(--panel3); color:var(--text);}
.rp-q{display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:8px; margin-bottom:14px;}

<div id="root"></div>
<div id="modalRoot"></div>
<script>
'use strict';
/* =====================================================================
   Game Load — live capture (build 2)
   No player names live in this code: the roster is entered on the device
   and stored only there (IndexedDB).

   EVENT MODEL (single source of truth: game.events)
   Every event: { s: seq, t: type, p: period (1-4 = Q, 5+ = OT), c: seconds left on scoreboard }
     start  { lineup:[5 ids] }                     game starts (Q1, full clock)
     sub    { out:[ids], in:[ids], us, them }      grouped substitution + scoreboard snapshot
     pts    { team:'us'|'them', pts:n }            +1/+2/+3 buttons (at last known clock)
     scr    { us, them }                           manual scoreboard correction
     foul   { pl:id }                              personal foul (at last known clock)
     tick   { }                                    clock update only (refreshes live minutes)
     pend   { us, them }                           end of period (c = 0)
     end    { us, them }                           game finished (c = clock left, usually 0)
   Everything else (minutes, stints, +/-, lineups, fouls) is derived by derive().
   ===================================================================== */
const APP_VERSION = '2.5.6';
const APP_ID = 'game-load';
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function fmtS(sec){ sec = Math.max(0, Math.round(sec || 0)); const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + String(s).padStart(2, '0'); }
function fmtMin(min){ return fmtS((min || 0) * 60); }
function sgn(n){ return n > 0 ? '+' + n : String(n); }
function pmCls(n){ return n > 0 ? 'pos' : (n < 0 ? 'neg' : 'zero'); }
function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function defaultSeason(){ const d = new Date(), y = d.getFullYear(); return d.getMonth() >= 6 ? y + '-' + (y + 1) : (y - 1) + '-' + y; }
function fmtDate(iso){ if(!iso) return ''; const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}); }

/* ---------------- storage ---------------- */
const Store = {
  mode: 'mem', db: null, mem: {kv:{}, games:{}},
  async init(){
    try {
      if(!('indexedDB' in window)) throw new Error('no idb');
      this.db = await this._open();
      this.mode = 'idb';
    } catch(e) {
      try { localStorage.setItem('pc2:t', '1'); localStorage.removeItem('pc2:t'); this.mode = 'ls'; } catch(e2) { this.mode = 'mem'; }
    }
    try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}
  },
  /* iPad/Safari can drop the IndexedDB connection while the app sits in the background
     ("Connection to Indexed Database server lost"); every later write then fails.
     _open() (re)connects; _run() retries a failed operation once on a fresh connection. */
  _open(){
    return new Promise((res, rej) => {
        const r = indexedDB.open('game-load', 1);
        r.onupgradeneeded = () => { const d = r.result;
          if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
          if(!d.objectStoreNames.contains('games')) d.createObjectStore('games', {keyPath:'id'}); };
        r.onsuccess = () => { const d = r.result; d.onclose = () => { if(Store.db === d) Store.db = null; }; d.onversionchange = () => { try { d.close(); } catch(e){} if(Store.db === d) Store.db = null; }; res(d); };
        r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
        setTimeout(() => rej(new Error('timeout')), 5000);
      });
  },
  _os(store, mode){ return this.db.transaction(store, mode).objectStore(store); },
  async _run(store, mode, fn){
    try {
      if(!this.db) this.db = await this._open();
      return await this._p(fn(this._os(store, mode)));
    } catch(e) {
      console.warn('IndexedDB ' + mode + ' failed, reconnecting once:', e);
      try { if(this.db) this.db.close(); } catch(x) {}
      this.db = null;
      this.db = await this._open();
      return await this._p(fn(this._os(store, mode)));
    }
  },
  _p(req){ return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); },
  async getKV(k){
    if(this.mode === 'idb') return this._run('kv', 'readonly', os => os.get(k));
    if(this.mode === 'ls'){ const v = localStorage.getItem('pc2:kv:' + k); return v ? JSON.parse(v) : undefined; }
    return this.mem.kv[k];
  },
  async setKV(k, v, fromCloud){
    if(!fromCloud && (k === 'roster' || k === 'settings')){ A.metaUpdated = Date.now(); this.setKV('metaUpdated', A.metaUpdated, true); Cloud.queueMeta(); }
    if(this.mode === 'idb') return this._run('kv', 'readwrite', os => os.put(v, k));
    if(this.mode === 'ls') return localStorage.setItem('pc2:kv:' + k, JSON.stringify(v));
    this.mem.kv[k] = v;
  },
  async allGames(){
    if(this.mode === 'idb') return this._run('games', 'readonly', os => os.getAll());
    if(this.mode === 'ls'){ const out = []; for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k.indexOf('pc2:g:') === 0) out.push(JSON.parse(localStorage.getItem(k))); } return out; }
    return Object.values(this.mem.games);
  },
  async putGame(g, fromCloud){
    const c = JSON.parse(JSON.stringify(g));
    if(!fromCloud) Cloud.queueGame(g.id);
    if(this.mode === 'idb') return this._run('games', 'readwrite', os => os.put(c));
    if(this.mode === 'ls') return localStorage.setItem('pc2:g:' + g.id, JSON.stringify(c));
    this.mem.games[g.id] = c;
  },
  async delGame(id, fromCloud){
    if(!fromCloud) Cloud.delGame(id);
    if(this.mode === 'idb') return this._run('games', 'readwrite', os => os.delete(id));
    if(this.mode === 'ls') return localStorage.removeItem('pc2:g:' + id);
    delete this.mem.games[id];
  }
};

/* ---------------- cloud copy (claude.ai artifact database) ----------------
   The device database stays the working copy (works offline during games).
   When the page runs inside claude.ai with the `db` capability, every saved game,
   the roster and the settings are also copied to the artifact's database, which
   survives new app versions. On start the two are merged: newest copy of each game wins;
   games deleted on any device stay deleted (tombstones). */
const Cloud = {
  db: null, state: 'init', last: 0, err: '', q: new Set(), metaDirty: false, delQ: new Set(), timer: null, busy: false, n: 0,
  async init(){
    if(!(window.claude && typeof window.claude.use === 'function')){ this.state = 'na'; if(A.route.name !== 'live') render(); return; }
    try { this.db = await window.claude.use('db'); } catch(e){ this.db = null; }
    if(!this.db){ this.state = 'na'; refreshCloud(); return; }
    await this.pull();
    window.addEventListener('online', () => this.flushSoon(500));
  },
  queueGame(id){ if(this.state === 'na') return; this.q.add(id); this.flushSoon(); },
  queueMeta(){ if(this.state === 'na') return; this.metaDirty = true; this.flushSoon(); },
  delGame(id){ if(this.state === 'na') return; A.tomb = A.tomb || {}; A.tomb[id] = Date.now(); Store.setKV('tomb', A.tomb, true); this.metaDirty = true; this.q.delete(id); this.delQ.add(id); this.flushSoon(); },
  flushSoon(ms){ clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), ms == null ? 2500 : ms); },
  metaDoc(){
    const s = Object.assign({}, A.settings);
    if(s.logo && s.logo.length > 180000){ delete s.logo; delete s.logoJpg; }
    if(s.logoJpg && s.logoJpg.length > 60000) delete s.logoJpg;
    return {roster: A.roster, settings: s, updated: A.metaUpdated || Date.now(), tomb: A.tomb || {}};
  },
  async flush(){
    if(!this.db || this.busy) return;
    if(!this.pulled) return; // merge with the cloud first
    this.busy = true; let ok = true;
    try {
      for(const id of Array.from(this.delQ)){
        await this.db.doc('gl_games/' + id).delete(); this.delQ.delete(id);
      }
      for(const id of Array.from(this.q)){
        const g = A.games[id]; this.q.delete(id); if(!g) continue;
        const body = JSON.parse(JSON.stringify(g));
        if(JSON.stringify(body).length > 250000){ this.err = 'Game vs ' + (g.info.opponent || '') + ' too large for the cloud copy'; ok = false; continue; }
        try { await this.db.doc('gl_games/' + id).set(body); } catch(e){ this.q.add(id); throw e; }
      }
      if(this.metaDirty){ this.metaDirty = false; await this.db.doc('gl/meta').set(this.metaDoc()); }
      if(ok) this.err = '';
      this.state = 'ok'; this.last = Date.now(); this.n = Object.keys(A.games).length;
    } catch(e){
      this.state = navigator.onLine === false ? 'offline' : 'error'; this.err = (e && (e.code || e.message)) || 'error';
      this.flushSoon(navigator.onLine === false ? 30000 : 15000);
    }
    this.busy = false; refreshCloud();
  },
  async pull(){
    this.state = 'syncing'; refreshCloud();
    try {
      const [ms, qs] = await Promise.all([this.db.doc('gl/meta').get(), this.db.collection('gl_games').limit(1000).get()]);
      const meta = ms.exists ? ms.data() : null;
      const tomb = Object.assign({}, A.tomb || {}, (meta && meta.tomb) || {});
      A.tomb = tomb;
      let changed = false, map = {}; const remapped = new Set();
      // roster: the cloud roster is the reference (its player ids are kept on every device).
      // Players only on this device are added; same name with another id is mapped onto the cloud id and
      // this device's games are rewritten to match. Player fields and settings: newest copy wins.
      if(meta && Array.isArray(meta.roster) && meta.roster.length){
        const localNewer = !!A.metaUpdated && A.metaUpdated > (meta.updated || 0);
        const base = JSON.parse(JSON.stringify(meta.roster)); map = {};
        let added = false;
        A.roster.forEach(lp => {
          const cp = base.find(b => b.id === lp.id) || base.find(b => String(b.name).toLowerCase() === String(lp.name).toLowerCase());
          if(cp){ if(cp.id !== lp.id) map[lp.id] = cp.id; if(localNewer){ const keep = cp.id; Object.assign(cp, JSON.parse(JSON.stringify(lp)), {id: keep}); } }
          else { base.push(JSON.parse(JSON.stringify(lp))); added = true; }
        });
        const rosterChanged = JSON.stringify(base) !== JSON.stringify(A.roster);
        A.roster = base;
        if(Object.keys(map).length){
          for(const g of Object.values(A.games)){ const before = JSON.stringify(g); remapGame(g, map); if(JSON.stringify(g) !== before){ await Store.putGame(g, true); remapped.add(g.id); } }
        }
        if(!localNewer && meta.settings){
          const keep = {lastBackup: A.settings.lastBackup, logo: A.settings.logo, logoJpg: A.settings.logoJpg, logoW: A.settings.logoW, logoH: A.settings.logoH};
          A.settings = Object.assign({}, DEFAULTS, A.settings, meta.settings);
          if(!meta.settings.logo && keep.logo) Object.assign(A.settings, {logo:keep.logo, logoJpg:keep.logoJpg, logoW:keep.logoW, logoH:keep.logoH});
          A.settings.lastBackup = Math.max(keep.lastBackup || 0, meta.settings.lastBackup || 0);
        }
        if(localNewer || added) this.metaDirty = true; else A.metaUpdated = meta.updated || 0;
        await Store.setKV('roster', A.roster, true); await Store.setKV('settings', A.settings, true); await Store.setKV('metaUpdated', A.metaUpdated || 0, true);
        if(rosterChanged) changed = true;
      } else if(A.roster.length) this.metaDirty = true;
      await Store.setKV('tomb', A.tomb, true);
      // games
      const cloudIds = new Set();
      for(const d of qs.docs){
        const cg = d.data(); if(!cg || !cg.id) continue; cloudIds.add(cg.id);
        if(tomb[cg.id] && (cg.updated || 0) <= tomb[cg.id]){ try { await this.db.doc('gl_games/' + cg.id).delete(); } catch(e){} continue; }
        const lg = A.games[cg.id];
        if(!lg || (cg.updated || 0) > (lg.updated || 0)){ const c = JSON.parse(JSON.stringify(cg)); if(Object.keys(map).length) remapGame(c, map); A.games[c.id] = c; await Store.putGame(c, true); changed = true; }
        else if((lg.updated || 0) > (cg.updated || 0) || remapped.has(lg.id)) this.q.add(lg.id);
      }
      for(const id of Object.keys(A.games)){
        if(tomb[id] && (A.games[id].updated || 0) <= tomb[id]){ delete A.games[id]; await Store.delGame(id, true); changed = true; continue; }
        if(!cloudIds.has(id)) this.q.add(id);
      }
      this.pulled = true; this.state = 'ok'; this.last = Date.now(); this.n = Object.keys(A.games).length;
      if(changed && A.route.name !== 'live') render();
      if(this.q.size || this.metaDirty) this.flushSoon(300);
    } catch(e){
      this.state = navigator.onLine === false ? 'offline' : 'error'; this.err = (e && (e.code || e.message)) || 'error';
      setTimeout(() => this.pull(), 20000);
    }
    refreshCloud();
  },
  label(){
    const t = this.last ? new Date(this.last).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}) : '';
    return ({init:'Cloud copy: starting…', syncing:'Cloud copy: syncing…', na:'Cloud copy: not available here — use backup files',
      ok:'Cloud copy ✓ ' + this.n + ' games · ' + t + (this.q.size || this.metaDirty ? ' · saving…' : ''),
      offline:'Cloud copy: offline — will sync when back online', error:'Cloud copy: not synced (' + this.err + ') — will retry'})[this.state];
  }
};
function refreshCloud(){ const el = document.getElementById('cloudState'); if(el){ el.textContent = Cloud.label(); el.className = 'note cloud-' + Cloud.state; } }

/* ---------------- app state ---------------- */
const DEFAULTS = { teamName:'', qLen:10, otLen:5, stintLimit:6, stintOrange:4.5, stintRed:6.5, breakBonus:1.5, m7Amber:45, m7Red:60, totalLimit:30, foulQ1:2, foulHalf:3, foulLate:4, view:'performance', trackPoss:false, baselineScope:'official', lastBackup:0 };
const A = { settings: Object.assign({}, DEFAULTS), roster: [], games: {}, route: {name:'home'}, sel: {out:[], in:[]}, saveErr: false };

async function saveSettings(){ try { await Store.setKV('settings', A.settings); A.saveErr = false; return true; } catch(e){ saveFailed(e); return false; } }
async function saveRoster(){ try { await Store.setKV('roster', A.roster); A.saveErr = false; return true; } catch(e){ saveFailed(e); return false; } }
async function saveGame(g){ g.updated = Date.now(); g.rev = (g.rev || 0) + 1; A.games[g.id] = g; try { await Store.putGame(g); A.saveErr = false; } catch(e){ saveFailed(e); } }
function saveFailed(e){ A.saveErr = true; A.saveErrMsg = ((e && e.name) || 'Error') + ': ' + ((e && e.message) || String(e)) + ' · ' + new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}); toast('⚠ Could not save on this device (' + ((e && e.name) || 'error') + ') — export a backup now'); console.error(e); }

function roleOf(pos){ pos = String(pos || '').toUpperCase(); if(pos === 'PG') return 'PG'; if(pos === 'PF' || pos === 'C' || pos === 'B') return 'Big'; return pos ? 'Wing' : ''; }
function player(id){ return A.roster.find(p => p.id === id) || {id, name:'?', num:''}; }
function pName(id){ return player(id).name; }
function pNumSort(a, b){ const na = parseInt(player(a).num, 10), nb = parseInt(player(b).num, 10); return (isNaN(na) ? 999 : na) - (isNaN(nb) ? 999 : nb) || pName(a).localeCompare(pName(b)); }
/* stint colours: green up to Orange, orange up to Red, red above Red; each quarter break played through adds breakBonus to both. Player "stint limit" in the roster overrides Red. */
function stintThr(id, crossQ){ const S = A.settings, p = player(id); const red = ((p.stintLimit > 0 ? p.stintLimit : (S.stintRed || 6.5)) + (crossQ || 0) * (S.breakBonus || 0)) * 60; return {red, orange: red - ((S.stintRed || 6.5) - (S.stintOrange || 4.5)) * 60}; }
function stintLevel(id, sec, crossQ){ const t = stintThr(id, crossQ); return sec > t.red ? 'high' : sec > t.orange ? 'watch' : 'fresh'; }
function m7Level(sec){ const S = A.settings; return sec > (S.m7Red || 60) * 60 ? 'high' : sec >= (S.m7Amber || 45) * 60 ? 'watch' : 'fresh'; }
function vsLevel(v){ return v == null ? '' : v >= .5 ? 'high' : v >= .25 ? 'watch' : v <= -.25 ? 'low' : ''; }
const LVC = {fresh:'var(--green)', watch:'var(--orange)', high:'#ff4d6a', low:'var(--blue)', '':'inherit'};
function limitsOf(id){ const p = player(id); return { stint: (p.stintLimit > 0 ? p.stintLimit : A.settings.stintLimit) * 60, total: (p.totalLimit > 0 ? p.totalLimit : A.settings.totalLimit) * 60 }; }

/* ---------------- time helpers ---------------- */
function pLen(g, p){ return (p <= 4 ? g.qLen : g.otLen) * 60; }
function pStart(g, p){ return p <= 4 ? (p - 1) * g.qLen * 60 : 4 * g.qLen * 60 + (p - 5) * g.otLen * 60; }
function evE(g, ev){ return pStart(g, ev.p) + (pLen(g, ev.p) - ev.c); }
function pLabel(p){ return p <= 4 ? 'Q' + p : 'OT' + (p - 4); }
function bandOf(min){ if(min <= 15) return {k:'low', c:'#34d399', l:'Low'}; if(min <= 20) return {k:'med', c:'#f2c94c', l:'Medium'}; if(min <= 30) return {k:'high', c:'#f2994a', l:'High'}; if(min <= 35) return {k:'vhigh', c:'#ff4d6a', l:'Very high'}; return {k:'ext', c:'#b48cf2', l:'Extreme'}; }
function foulTrouble(period, n){ const S = A.settings; if(n >= 5) return 'out'; if(period <= 1) return n >= S.foulQ1 ? 'trouble' : ''; if(period === 2) return n >= S.foulHalf ? 'trouble' : ''; return n >= S.foulLate ? 'trouble' : ''; }

/* ---------------- derive: events -> everything ---------------- */
function typeRank(t){ return t === 'start' ? 0 : (t === 'pend' || t === 'end') ? 2 : 1; }
function sortEvents(g){
  return g.events.slice().sort((a, b) => (a.p - b.p) || (typeRank(a.t) === 2 ? 1 : 0) - (typeRank(b.t) === 2 ? 1 : 0) || (b.c - a.c) || (typeRank(a.t) - typeRank(b.t)) || (a.s - b.s));
}
function deriveImported(g){
  const R = deriveImported0(g); if(g.stints) importedStints(g, R); return R;
}
function deriveImported0(g){
  return {imported:true, period:4, slots:[], mins:Object.assign({}, g.mins), minsP:{}, stints:{}, runs:{}, fouls:{}, teamFouls:{}, us:g.final.us, them:g.final.them, scoreP:{}, pm:{}, lineups:{}, warnings:[], ended:true,
    subs:0, subEvents:0, subLog:[], nowE:2400, starters:[], curStint:{}, curCross:{}, lastOut:{}, curLine:null, maxP:4, hasScore:true, poss:{us:0, them:0}, possP:{}, pposs:{}, possList:[],
    ptsSum:{us:0, them:0}, scPoss:{us:0, them:0}, possPts:{us:0, them:0}, clock:0, gameSec:2400, endE:2400, endP:4, hasStints:false};
}
function derive(g){
  if(g.imported) return deriveImported(g);
  const R = { period:1, slots:[], mins:{}, minsP:{}, stints:{}, fouls:{}, teamFouls:{}, us:0, them:0, scoreP:{}, pm:{}, lineups:{},
    warnings:[], ended:false, subs:0, subEvents:0, subLog:[], nowE:0, starters:null, curStint:{}, lastOut:{}, curLine:null, maxP:1, hasScore:false, poss:{us:0, them:0}, possP:{}, pposs:{}, lastPoss:null, possList:[], curPoss:null, ptsSum:{us:0, them:0} };
  const sStart = {}, sDiff = {}, runOf = {}, runStartE = {}, crossOf = {}; let runCtr = 0;
  const newRun = (id, E) => { runOf[id] = ++runCtr; runStartE[id] = E; crossOf[id] = 0; };
  let line = null;
  const diff = () => R.us - R.them;
  const open = (id, E) => { sStart[id] = E; sDiff[id] = diff(); };
  const close = (id, E, p, isOpen) => {
    const s = sStart[id]; if(s == null) return;
    const d = E - s;
    if(d > 0){
      const pm = diff() - sDiff[id];
      (R.stints[id] = R.stints[id] || []).push({s, e:E, p, d, pm, open:!!isOpen, run:runOf[id]});
      R.mins[id] = (R.mins[id] || 0) + d;
      (R.minsP[id] = R.minsP[id] || {})[p] = (R.minsP[id][p] || 0) + d;

    }

  };
  const lineOpen = E => { const ids = R.slots.filter(Boolean); line = ids.length === 5 ? {key: ids.slice().sort().join('|'), ids: ids.slice(), s:E, us:R.us, them:R.them} : null; };
  /* possessions: a tap starts one; a basket by the team with the ball scores it and automatically starts the rival's (auto).
     Points by the scoring team right after (and-one, 2nd free throw) stay on the possession that scored.

  let cur = null;

  const lineClose = (E, isOpen) => {

  for(const ev of sortEvents(g)){
    const E = evE(g, ev);
    if(ev.t !== 'start' && !R.ended){
      while(ev.p > R.period){ const pe = pStart(g, R.period + 1); periodBreak(pe, R.period); R.period++; periodOpen(pe, R.period - 1); R.warnings.push('Missing end of ' + pLabel(R.period - 1)); }
    }

    if(R.starters === null && E > 0 && R.slots.length) R.starters = R.slots.slice();

      case 'start': R.slots = (ev.lineup || []).slice(0, 5); R.slots.forEach(id => { newRun(id, E); open(id, E); }); lineOpen(E); break;
      case 'sub': {
        snap(ev);
        const pairs = [];
        (ev.out || []).forEach((o, i) => {
          const inn = ev.in[i]; const idx = R.slots.indexOf(o);
          if(idx < 0){ R.warnings.push(pLabel(ev.p) + ' ' + fmtS(ev.c) + ': ' + pName(o) + ' was not on court'); return; }
          if(R.slots.indexOf(inn) >= 0 || pairs.some(x => x[2] === inn)){ R.warnings.push(pLabel(ev.p) + ' ' + fmtS(ev.c) + ': ' + pName(inn) + ' was already on court'); return; }
          pairs.push([idx, o, inn]);
        });
        if(pairs.length){
          lineClose(E);
          pairs.forEach(([idx, o, inn]) => { close(o, E, ev.p); R.slots[idx] = inn; newRun(inn, E); open(inn, E); R.lastOut[o] = E; });

        else if(cur && cur.auto && cur.from && cur.from.team === X){ cur.from.pts += ev.pts; }

    }

    { const dd = R.us - R.them, last = R.flow[R.flow.length - 1]; if(dd !== last.d) R.flow.push({E, d:dd}); }

  });

  R.possPts = {us: R.possList.filter(q => q.team === 'us').reduce((a, q) => a + q.pts, 0), them: R.possList.filter(q => q.team === 'them').reduce((a, q) => a + q.pts, 0)};

}

// runs = real stints (segments of the same run merged); crossQ = quarter breaks played through
function buildRuns(R){
  R.runs = {};
  Object.keys(R.stints).forEach(id => {
    const by = {};
    R.stints[id].forEach(sg => { const r = by[sg.run] = by[sg.run] || {s:sg.s, e:sg.e, d:0, pm:0, open:false, ps:[]}; r.e = sg.e; r.d += sg.d; r.pm += (sg.pm || 0); r.open = sg.open; if(r.ps.indexOf(sg.p) < 0) r.ps.push(sg.p); });
    R.runs[id] = Object.keys(by).map(k => by[k]).sort((a, b) => a.s - b.s).map(r => Object.assign(r, {crossQ: r.ps.length - 1}));
  });
}
/* imported games may carry g.stints = {playerId: [[startSec, endSec], ...]} in game seconds (no score, so no +/-).
   Same rules as live games: a stint runs on through Q1→Q2 and Q3→Q4 (and Q4→OT), halftime starts a new one. */
function importedStints(g, R){
  let run = 0; const half = pStart(g, 3);
  Object.keys(g.stints || {}).forEach(id => {
    const list = (g.stints[id] || []).slice().sort((a, b) => a[0] - b[0]);
    R.stints[id] = []; let lastE = -1;
    list.forEach(([s0, e0]) => {
      if(!(e0 > s0)) return;
      if(Math.abs(s0 - lastE) > 1 || s0 === half) run++;
      // split at period boundaries
      let s = s0;
      while(s < e0 - 0.01){
        let p = 1; while(pStart(g, p + 1) <= s + 0.01) p++;
        const pe = pStart(g, p + 1), e = Math.min(e0, pe);
        if(s === half && s !== s0) run++;
        R.stints[id].push({s, e, p, d: e - s, pm: null, open: false, run});
        s = e;
      }
      lastE = e0;
    });
  });
  buildRuns(R);
  R.starters = Object.keys(R.stints).filter(id => R.stints[id].length && R.stints[id][0].s < 1);
  R.hasStints = true;
}

const DCACHE = {};
function deriveC(g){ const c = DCACHE[g.id]; if(c && c.rev === g.rev && c.n === g.events.length) return c.R; const R = derive(g); DCACHE[g.id] = {rev:g.rev, n:g.events.length, R}; return R; }
function longestRun(R, id){ const rs = R.runs[id] || []; let best = null; rs.forEach(r => { if(!best || r.d > best.d) best = r; }); return best || {d:0, crossQ:0}; }
function qMark(n){ return n ? '<span class="qx" title="Played through ' + n + ' quarter break' + (n > 1 ? 's' : '') + '">+Q</span>' : ''; }
/* ---------------- season baseline ---------------- */
function countsForBaseline(g){ if(g.status !== 'finished' || g.demo) return false; if(A.settings.baselineScope !== 'all' && /friendly|test|pre/i.test(g.info.competition || '')) return false; return true; }
function gameKey(g){ return (g.info.date || '') + '|' + String(g.created || 0).padStart(15, '0'); }
function baseline(id, ref){
  const refG = typeof ref === 'string' ? A.games[ref] : ref, refK = refG ? gameKey(refG) : '~';
  const p = player(id); let n = +p.prevGames || 0, sum = n * (+p.prevAvg || 0) * 60, ot = 0;
  Object.values(A.games).forEach(g => {
    if(!countsForBaseline(g) || (refG && g.id === refG.id) || gameKey(g) >= refK) return;
    // counts every game he was in the squad (dressed), 0 if he did not play (coach's decision);
    // games he was not in the squad (injury, rest, not called up) do not count

}

/* ================= SEASON ================= */
function seasonStats(scope){
  const games = Object.values(A.games).filter(g => g.status === 'finished' && !g.demo && (scope === 'all' || !/friendly|test|pre/i.test(g.info.competition || '')));
  const withSt = [], P = {};
  games.forEach(g => {
    const R = deriveC(g); const has = !g.imported || R.hasStints; if(has) withSt.push(g);
    const half = pStart(g, 3), q4s = pStart(g, 4), q4e = pStart(g, 5);
    Object.keys(R.mins).forEach(id => {
      const m = R.mins[id] || 0; if(m <= 0) return;
      const o = P[id] = P[id] || {gp:0, sec:0, sg:0, n:0, d:0, mx:0, red:0, nt:0, comp:0, q4:0, reg:0, mxG:null};
      o.gp++; o.sec += m;
      if(!has) return;
      const runs = R.runs[id] || []; o.sg++;
      runs.forEach((r, i) => {
        o.n++; o.d += r.d; if(r.d > o.mx){ o.mx = r.d; o.mxG = g; }
        if(stintLevel(id, r.d, r.crossQ) === 'high') o.red++;
        o.q4 += Math.max(0, Math.min(r.e, q4e) - Math.max(r.s, q4s)); o.reg += Math.max(0, Math.min(r.e, q4e) - r.s);
        const nx = runs[i + 1];
        if(nx && !(r.e <= half && nx.s >= half)){ o.nt++; if(nx.s - r.e < r.d) o.comp++; }
      });
    });
  });
  return {games, withSt, P};
}

function parseAvg(v){ v = String(v || '').trim(); if(!v) return 0; if(v.indexOf(':') >= 0){ const [m, s] = v.split(':'); return (+m || 0) + (+s || 0) / 60; } const n = parseFloat(v.replace(',', '.')); return isNaN(n) ? 0 : n; }
function parseRoster(text){
  const lines = text.split(/\r?\n/).map(l => l.replace(/\s+$/, '')).filter(l => l.trim());
  if(!lines.length) return [];
  const delim = lines[0].indexOf('\t') >= 0 ? '\t' : (lines[0].indexOf(';') >= 0 ? ';' : ',');

  const c = EM; let h = '<h3>' + c.title + '</h3>' + (c.sub ? '<div class="sub">' + c.sub + '</div>' : '') + (c.swap || '');

/* ===== Copy for BMA365 — JSON "gameload-bma365/v1" (spec: project doc claude/gameload-bma365-json-v1.md)
   Game Load owns everything about the game; BMA365 only stores and shows it. Times = whole seconds,
   start/end = game seconds from 0, clock = seconds left in the period. Names = Platform name. */
const BMA_SCHEMA = 'gameload-bma365/v1';
function bmaCompetition(c){ const v = String(c || '').trim().toLowerCase(); if(v === 'bbl') return 'BBL'; if(v === 'bcl' || v === 'champions league' || v === 'basketball champions league') return 'BCL'; if(v === 'pokal' || v === 'cup' || v === 'bbl pokal') return 'Cup'; if(v === 'friendly' || v === 'test' || v === 'preseason') return 'Friendly'; return null; }
function buildBma(g){
  const R = derive(g), I = g.info || {}, M = buildReport(g), live = !g.imported, maxP = Math.max(4, R.maxP);
  const ps = []; for(let p = 1; p <= maxP; p++) ps.push(p);
  const S = x => Math.round(x || 0), pn = id => (player(id).platformName || '').trim();
  const errors = [], warnings = [];
  // ---- checks
  if(live && !R.ended) errors.push('The game is not finished (no end of game).');
  if(!I.date || !/^\d{4}-\d{2}-\d{2}$/.test(I.date)) errors.push('The game has no valid date.');
  const comp = bmaCompetition(I.competition);
  if(!comp) errors.push('Competition "' + (I.competition || '') + '" must be BBL, BCL, Pokal or Friendly.');
  const noName = M.played.filter(p => !pn(p.id)).map(p => p.name);
  if(noName.length) errors.push('No Platform name for: ' + noName.join(', ') + ' (Roster → Edit).');
  const dupName = {}; M.played.forEach(p => { const n = pn(p.id).toLowerCase(); if(n) dupName[n] = (dupName[n] || 0) + 1; });
  Object.keys(dupName).filter(n => dupName[n] > 1).forEach(n => errors.push('Two players share the Platform name "' + n + '".'));
  const gameSec = live ? R.gameSec : (4 * (g.qLen || 10) * 60 + Math.max(0, maxP - 4) * (g.otLen || 5) * 60);
  const sumMin = M.played.reduce((a, p) => a + p.tot, 0);
  if(Math.abs(sumMin - 5 * gameSec) > (live ? 5 : 60)) (live ? errors : warnings).push('Minutes add up to ' + fmtS(sumMin) + ', expected 5 × ' + fmtS(gameSec) + ' = ' + fmtS(5 * gameSec) + '.');
  M.played.forEach(p => { if(p.tot < 0 || p.tot > gameSec + 1) errors.push(p.name + ': ' + fmtS(p.tot) + ' minutes is not possible in this game.'); });
  let pmVerified = false;
  if(live && R.hasScore){
    const pmSum = M.played.reduce((a, p) => a + p.pm, 0);

function roleOfId(id){ return roleOf(player(id).pos); }
function roleKey(ids){ const c = {PG:0, Wing:0, Big:0, '':0}; ids.forEach(id => { c[roleOfId(id)]++; }); return c.PG + ' PG · ' + c.Wing + ' Wing · ' + c.Big + ' Big' + (c[''] ? ' · ' + c[''] + ' ?' : ''); }
function per100(a, n){ return n ? a / n * 100 : null; }

function dayNum(iso){ return Math.round(new Date(iso + 'T12:00:00').getTime() / 864e5); }
/* minutes in the 7 days up to and including this game (all competitions, demo excluded) */
function windowLoad(g, days){
  const ref = dayNum(g.info.date), k = gameKey(g), out = {games:[g], mins:{}};
  Object.values(A.games).forEach(x => { if(x.id === g.id || x.status !== 'finished' || x.demo || !x.info.date) return; const dn = dayNum(x.info.date); if(dn > ref || dn <= ref - days) return; if(dn === ref && gameKey(x) >= k) return; out.games.push(x); });
  out.games.forEach(x => { const R = deriveC(x); Object.keys(R.mins).forEach(id => { out.mins[id] = (out.mins[id] || 0) + R.mins[id]; }); });
  return out;
}
function restDays(g){
  const ref = dayNum(g.info.date); let best = null;
  Object.values(A.games).forEach(x => { if(x.id === g.id || x.demo || x.status !== 'finished' || !x.info.date) return; const dn = dayNum(x.info.date); if(dn < ref && (best == null || dn > best)) best = dn; });
  return best == null ? null : ref - best - 1;
}
/* re-entries after resting less than the stint just played (same half; halftime counts as full rest) */
function shortRest(R, id, g){ const rs = R.runs[id] || [], half = pStart(g, 3); let n = 0, of = 0;
  rs.forEach((r, i) => { const nx = rs[i + 1]; if(!nx || (r.e <= half && nx.s >= half)) return; of++; if(nx.s - r.e < r.d) n++; }); return {n, of}; }
function buildReport(g){
  const R = derive(g), I = g.info, S = A.settings, maxP = Math.max(4, R.maxP);
  const ps = []; for(let p = 1; p <= maxP; p++) ps.push(p);
  const usName = g.teamName || S.teamName || 'Us', gameMin = R.gameSec / 60;
  const hasPoss = R.poss.us + R.poss.them > 0;
  const W7 = windowLoad(g, 7), rest = restDays(g);
  // ---- players
  const players = g.dressed.map(id => {
    const p = player(id), tot = R.mins[id] || 0, runs = R.runs[id] || [], lr = longestRun(R, id), b = baseline(id, g);
    const fouls = R.fouls[id] || [];
    let trouble = null; fouls.forEach((f, i) => { if(!trouble && foulTrouble(f.p, i + 1)) trouble = {n:i + 1, p:f.p}; });
    const age = p.birthYear && I.date ? (+I.date.slice(0, 4)) - p.birthYear : null;
    const po = R.pposs[id];
    return { id, name:p.name, num:p.num, role:roleOf(p.pos), age, starter: R.starters.indexOf(id) >= 0, tot, minsP: ps.map(q => (R.minsP[id] || {})[q] || 0),
      band: bandOf(tot / 60), avg: b.avg, avgGames: b.games, vsAvg: b.avg && tot ? (tot / b.avg - 1) : null,
      stints: runs.length, avgStint: runs.length ? tot / runs.length : 0, longest: lr.d, longestQ: lr.crossQ, fouls: fouls.length, trouble,
      m7: (W7.mins[id] || 0), g7: W7.games.filter(x => (deriveC(x).mins[id] || 0) > 0).length,
      shortRe: shortRest(R, id, g), pm: R.pm[id] || 0, possOn: po ? (po.us + po.them) / 2 : 0, net100: po && (po.us + po.them) / 2 >= 10 ? per100(R.pm[id] || 0, (po.us + po.them) / 2) : null };
  }).sort((a, b) => pNumSort(a.id, b.id));
  const played = players.filter(p => p.tot > 0), dnp = players.filter(p => !p.tot);
  // ---- team shares
  const totalMin = played.reduce((a, p) => a + p.tot, 0);
  const benchMin = played.filter(p => !p.starter).reduce((a, p) => a + p.tot, 0);
  // ---- quarters
  const quarters = ps.map(q => {
    const sc = R.scoreP[q], prev = R.scoreP[q - 1] || {us:0, them:0};
    const subs = R.subLog.filter(x => x.ev.p === q).reduce((a, x) => a + x.pairs.length, 0);
    let longest = null;
    Object.keys(R.stints).forEach(id => R.stints[id].forEach(sg => { if(sg.p === q && (!longest || sg.d > longest.d)) longest = {id, d:sg.d}; }));
    const qTot = played.reduce((a, p) => a + p.minsP[q - 1], 0), qBench = played.filter(p => !p.starter).reduce((a, p) => a + p.minsP[q - 1], 0);
    const pp = R.possP[q];
    return { label:pLabel(q), us: sc ? sc.us - prev.us : null, them: sc ? sc.them - prev.them : null, subs, longest, benchPct: qTot ? qBench / qTot : 0,
      foulsQ: Object.keys(R.fouls).reduce((a, id) => a + R.fouls[id].filter(f => f.p === q).length, 0), poss: pp ? (pp.us + pp.them) / 2 : null };
  });
  // ---- lineups / roles / pairs
  const lus = Object.values(R.lineups).map(L => ({ ids:L.ids, sec:L.sec, iv:(L.iv || []).slice().sort((a, b) => a[0] - b[0]), pf:L.pf, pa:L.pa, pm:L.pf - L.pa, pu:L.pu || 0, pt:L.pt || 0,
    net100: per100(L.pf - L.pa, ((L.pu || 0) + (L.pt || 0)) / 2), role: roleKey(L.ids) })).sort((a, b) => b.sec - a.sec);
  const roles = {}; lus.forEach(L => { const r = roles[L.role] = roles[L.role] || {label:L.role, sec:0, pf:0, pa:0, pu:0, pt:0, n:0}; r.sec += L.sec; r.pf += L.pf; r.pa += L.pa; r.pu += L.pu; r.pt += L.pt; r.n++; });
  const roleList = Object.values(roles).map(r => Object.assign(r, {pm:r.pf - r.pa, net100: per100(r.pf - r.pa, (r.pu + r.pt) / 2)})).sort((a, b) => b.sec - a.sec);
  const pairs = {}; lus.forEach(L => { for(let i = 0; i < 5; i++) for(let j = i + 1; j < 5; j++){ const k = [L.ids[i], L.ids[j]].sort().join('|'); const o = pairs[k] = pairs[k] || {ids:[L.ids[i], L.ids[j]], sec:0, pm:0, pu:0, pt:0}; o.sec += L.sec; o.pm += L.pm; o.pu += L.pu; o.pt += L.pt; } });
  const PT = ['PG + PG', 'Wing + Wing', 'Big + Big', 'PG + Wing', 'PG + Big', 'Wing + Big'];
  const pairType = ids => { const r = ids.map(roleOfId).map(x => x || '?'); const o = ['PG', 'Wing', 'Big', '?']; r.sort((a, b) => o.indexOf(a) - o.indexOf(b)); return r.join(' + '); };
  const pairList = Object.values(pairs).map(o => Object.assign(o, {net100: per100(o.pm, (o.pu + o.pt) / 2), type: pairType(o.ids)})).sort((a, b) => b.sec - a.sec);
  const pairGroups = PT.concat(Array.from(new Set(pairList.map(o => o.type))).filter(t => PT.indexOf(t) < 0)).map(t => ({type:t, rows: pairList.filter(o => o.type === t && o.sec >= 120).slice(0, 3)})).filter(gp => gp.rows.length);
  // ---- possessions
  const box = g.box || {}, eu = boxPoss(box.us), et = boxPoss(box.them);
  const PM = g.possManual;
  const poss = !hasPoss && PM ? { us:PM.us, them:PM.them, pace:(PM.us + PM.them) / 2 / gameMin * 40, estUs: boxPoss((g.box || {}).us), estThem: boxPoss((g.box || {}).them), ppp:{us:PM.pppUs, them:PM.pppThem}, sc:{us:PM.scUs, them:PM.scThem}, coverage:1 } : hasPoss ? { us:R.poss.us, them:R.poss.them, pace: (R.poss.us + R.poss.them) / 2 / gameMin * 40, estUs:eu, estThem:et,
    ppp:{us: R.poss.us ? R.possPts.us / R.poss.us : null, them: R.poss.them ? R.possPts.them / R.poss.them : null},
    sc:{us: R.poss.us ? R.scPoss.us / R.poss.us : null, them: R.poss.them ? R.scPoss.them / R.poss.them : null},
    coverage: (R.us + R.them) ? (R.ptsSum.us + R.ptsSum.them) / (R.us + R.them) : 0 } : null;
  if(poss && hasPoss && PM){ poss.ppp = {us:PM.pppUs, them:PM.pppThem}; poss.sc = {us:PM.scUs, them:PM.scThem}; poss.coverage = 1; }
  // ---- key points (max 5, most important first)
  const kp = [];
  const lim = id => limitsOf(id).stint;
  const up = played.filter(p => p.avgGames >= 2 && p.vsAvg != null && p.vsAvg >= .25 && p.tot >= 15 * 60).sort((a, b) => b.vsAvg - a.vsAvg).slice(0, 2);
  up.forEach(p => kp.push({lv:'warn', t: p.name + ' played ' + fmtS(p.tot) + ', ' + Math.round(p.vsAvg * 100) + '% above his average (' + fmtS(p.avg) + ').'}));
  const hi = played.filter(p => p.tot >= 30 * 60);
  if(hi.length) kp.push({lv:'warn', t: hi.map(p => p.name + ' ' + fmtS(p.tot)).join(', ') + ' in the very high band (30+ min).'});
  const ls = played.slice().sort((a, b) => b.longest - a.longest)[0];
  if(ls) kp.push({lv: stintLevel(ls.id, ls.longest, ls.longestQ) === 'high' ? 'warn' : 'info', t: 'Longest stint: ' + ls.name + ' ' + fmtS(ls.longest) + (ls.longestQ ? ' (played through a quarter break)' : '') + '.'});
  /* early fouls: reached the half-time foul-trouble threshold (Settings, default 3) within the first half; or fouled out */
  const ef = played.map(p => { const f = (R.fouls[p.id] || []).filter(x => x.p <= 2); const thr = A.settings.foulHalf || 3; const hit = f.length >= thr ? f[thr - 1] : null;
    return {name:p.name, n1:f.length, at: hit ? pLabel(hit.p) + ' ' + fmtS(hit.c) : null, out: p.fouls >= 5}; }).filter(x => x.at || x.out);
  const efTxt = x => x.name + (x.at ? ' ' + x.n1 + ' fouls in 1st half (foul ' + (A.settings.foulHalf || 3) + ' at ' + x.at + ')' : '') + (x.out ? (x.at ? ', ' : ' ') + 'fouled out' : '');
  const h7 = played.filter(p => p.g7 >= 2 && p.m7 >= 45 * 60 && p.avg && p.m7 >= 2 * p.avg).sort((a, b) => b.m7 - a.m7).slice(0, 3);
  if(h7.length) kp.push({lv:'warn', t: 'Last 7 days: ' + h7.map(p => p.name + ' ' + fmtS(p.m7) + ' in ' + p.g7 + ' games').join(', ') + '.'});
  const down = played.filter(p => p.avgGames >= 2 && p.vsAvg != null && p.vsAvg <= -.4 && p.avg >= 12 * 60);
  if(down.length) kp.push({lv:'info', t: 'Well below usual minutes: ' + down.map(p => p.name + ' ' + fmtS(p.tot) + ' (avg ' + fmtS(p.avg) + ')').join(', ') + '.'});
  const bigL = lus.filter(L => L.sec >= 240);
  if(bigL.length){ const best = bigL.slice().sort((a, b) => b.pm - a.pm)[0], worst = bigL.slice().sort((a, b) => a.pm - b.pm)[0];
    kp.push({lv:'info', t: 'Best five (4+ min): ' + best.ids.map(pName).join(' · ') + ' ' + sgn(best.pm) + ' in ' + fmtS(best.sec) + (worst !== best && worst.pm < 0 ? '; worst ' + sgn(worst.pm) + ' in ' + fmtS(worst.sec) : '') + '.'}); }
  kp.push({lv:'info', t: 'Bench played ' + Math.round(benchMin / Math.max(1, totalMin) * 100) + '% of minutes; ' + played.length + ' players used, ' + R.subs + ' substitutions in ' + R.subEvents + ' stoppages.'});
  if(false && poss && poss.estUs){ const d = (poss.us - poss.estUs) / poss.estUs; if(Math.abs(d) > .1) kp.push({lv:'warn', t:'Live possession count differs ' + sgn(Math.round(d * 100)) + '% from the box score estimate: treat per-100 numbers with care.'}); }
  return { g, R, I, usName, ps, players, played, dnp, totalMin, benchMin, quarters, lus, roleList, pairList, pairGroups, poss: null, possLive: false, W7, rest, ef, efTxt, kp: kp.slice(0, 6), gameMin };
}

    d.rect(BX, y + 1, Math.max(0.8, sx(p.tot) - BX), 9, PLV[lv] || '#8c8c8c');
    if(p.avg){ const ax = sx(p.avg); d.rect(ax - 0.8, y - 1, 1.6, 13, PC.ink); }
    d.text(X + CW, y + 8, fmtS(p.tot) + (p.avg ? '  avg ' + fmtS(p.avg) + '  ' + (p.vsAvg == null ? '' : sgn(Math.round(p.vsAvg * 100)) + '%') : ''), {size:7.5, color: lv ? PLV[lv] : PC.mut, bold: !!lv, align:'right'});
    d.y += 13;
  });
  let lx = BX; [[PC.red, '>= +50% vs avg'], [PC.orange, '+25% to +50%'], ['#8c8c8c', 'within 25%'], [PC.blue, '<= -25%']].forEach(it => { d.rect(lx, d.y + 3, 10, 7, it[0]); d.text(lx + 13, d.y + 9, it[1], {size:7.5, color:PC.mut}); lx += 13 + textW(it[1], 7.5) + 14; });
  d.rect(lx, d.y + 1, 1.6, 11, PC.ink); d.text(lx + 5, d.y + 9, 'his average', {size:7.5, color:PC.mut});
  d.y += 22;
}
function pdfFlow(d, M, X, CW, head){
  const g = M.g, R = M.R, maxP = Math.max(4, R.maxP), total = pStart(g, maxP) + pLen(g, maxP);
  const NW = 70, TW = CW - NW - 40, TX = X + NW, sx = e => TX + e / total * TW;
  const pts = (R.flow || [{E:0, d:0}]).slice(); const endE = R.ended ? R.endE : R.nowE; if(pts[pts.length - 1].E < endE) pts.push({E:endE, d:pts[pts.length - 1].d});
  d.y += 12;
  const mx = Math.max(10, Math.ceil(Math.max.apply(null, pts.map(p => Math.abs(p.d))) / 10) * 10), Hh = 84, y0 = d.y + Hh / 2, sy = v => y0 - v / mx * (Hh / 2);
  // grid + labels
  [mx, mx / 2, 0, -mx / 2, -mx].forEach(v => { d.line(TX, sy(v), TX + TW, sy(v), v === 0 ? '#9a9a9a' : '#ececec', v === 0 ? 0.8 : 0.5); d.text(TX - 6, sy(v) + 2.5, (v > 0 ? '+' : '') + v, {size:6.5, color:PC.faint, align:'right'}); });
  for(let p = 2; p <= maxP; p++) d.rect(sx(pStart(g, p)) - (p === 3 ? 0.9 : 0.3), d.y, p === 3 ? 1.8 : 0.6, Hh, p === 3 ? '#151515' : '#c8c8c8');
  for(let p = 1; p <= maxP; p++){ const q = M.quarters[p - 1]; d.text(sx(pStart(g, p) + pLen(g, p) / 2), d.y - 4, pLabel(p) + (q && q.us != null ? '  ' + sgn(q.us - q.them) : ''), {size:7, bold:true, color:PC.mut, align:'center'}); }
  // area (green above zero, red below), then line
  for(let i = 1; i < pts.length; i++){
    const a = pts[i - 1], b = pts[i]; const x1 = sx(a.E), x2 = sx(b.E);
    const seg = (xa, va, xb, vb) => { if(xb - xa < 0.01) return; const col = (va + vb) / 2 >= 0 ? '#cdeedd' : '#fbd5db'; d.poly([[xa, y0], [xa, sy(va)], [xb, sy(vb)], [xb, y0]], col); };
    if((a.d > 0 && b.d < 0) || (a.d < 0 && b.d > 0)){ const t = a.d / (a.d - b.d), xc = x1 + (x2 - x1) * t; seg(x1, a.d, xc, 0); seg(xc, 0, x2, b.d); } else seg(x1, a.d, x2, b.d);
  }
  for(let i = 1; i < pts.length; i++){ const a = pts[i - 1], b = pts[i]; d.line(sx(a.E), sy(a.d), sx(b.E), sy(b.d), (a.d + b.d) / 2 >= 0 ? PC.green : PC.red, 1.2); }
  // biggest lead / deficit
  const hi = pts.reduce((m, p) => p.d > m.d ? p : m, pts[0]), lo = pts.reduce((m, p) => p.d < m.d ? p : m, pts[0]);
  if(hi.d > 0){ d.circle(sx(hi.E), sy(hi.d), 2.2, PC.green); d.text(sx(hi.E), sy(hi.d) - 4, 'max +' + hi.d, {size:6.8, bold:true, color:PC.green, align:'center'}); }
  if(lo.d < 0){ d.circle(sx(lo.E), sy(lo.d), 2.2, PC.red); d.text(sx(lo.E) - 5, sy(lo.d) - 4, 'max ' + lo.d, {size:6.8, bold:true, color:PC.red, align:'right'}); }
  // substitution ticks
  R.subLog.forEach(x => { const xx = sx(x.E); d.rect(xx - 0.3, d.y + Hh - 4, 0.6, 4, '#7a7a7a'); });
  d.y += Hh + 4;
  d.wrap('Above zero = ' + (M.usName || 'us') + ' ahead. Ticks at the bottom = substitutions. Same time axis as the rotation map below.' + (g.possManual ? ' Score between substitutions drawn as a straight line.' : ''), CW - NW, 7).forEach(l => { d.text(TX, d.y + 7, l, {size:7, color:PC.faint}); d.y += 9; });
  d.y += 8;
}
function pdfTimeline(d, M, X, CW, head){
  const g = M.g, R = M.R, maxP = Math.max(4, R.maxP), total = pStart(g, maxP) + pLen(g, maxP);
  const NW = 70, TW = CW - NW - 40, TX = X + NW, sx = e => TX + e / total * TW;
  const axis = () => { for(let p = 1; p <= maxP; p++){ const q = M.quarters[p - 1]; d.text(sx(pStart(g, p) + pLen(g, p) / 2), d.y + 8, pLabel(p) + (q && q.us != null ? '  ' + q.us + '-' + q.them : ''), {size:7.5, bold:true, color:PC.mut, align:'center'}); } d.y += 13; };
  axis();
  const st = R.starters || [], first = id => { const r = (R.runs[id] || [])[0]; return r ? r.s : 1e9; };
  const ids = g.dressed.slice().sort((a, b) => { const ia = st.indexOf(a), ib = st.indexOf(b); if(ia >= 0 || ib >= 0) return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); return first(a) - first(b) || pNumSort(a, b); });
  ids.forEach(id => {
    d.ensure(16, () => { head(); axis(); });
    const y = d.y, h = 11;
    d.text(TX - 6, y + 8.5, (st.indexOf(id) >= 0 ? '* ' : '') + pName(id), {size:8, bold:true, align:'right'});
    d.rect(TX, y, TW, h, '#efefef');
    for(let p = 2; p <= maxP; p++) d.rect(sx(pStart(g, p)) - (p === 3 ? 0.9 : 0.3), y - 1, p === 3 ? 1.8 : 0.6, h + 2, p === 3 ? '#151515' : '#b5b5b5');
    (R.runs[id] || []).forEach(r => { const x = sx(r.s), w = Math.max(0.8, sx(r.e) - x), lv = stintLevel(id, r.d, r.crossQ); const col = lv === 'high' ? PC.vhigh : lv === 'watch' ? PC.amber : PC.greenFill;
      d.rect(x, y, w, h, col); if(w > 26) d.text(x + w / 2, y + 8.2, fmtS(r.d), {size:6.8, bold:true, align:'center', color: lv === 'high' ? '#ffffff' : '#0b2a1f'});
      for(let p = 2; p <= maxP; p++){ const ps = pStart(g, p); if(ps > r.s && ps < r.e) d.diamond(sx(ps), y - 0.5, 3, PC.purple); } });
    (R.fouls[id] || []).forEach(f => d.circle(sx(pStart(g, f.p) + pLen(g, f.p) - f.c), y + h, 2.4, PC.orange));
    d.text(X + CW, y + 8.5, fmtS(R.mins[id] || 0), {size:8, align:'right', color:PC.mut});
    d.y += 15;
  });
  d.y += 2; let lx = TX;
  [[PC.greenFill, 'On court (stint)'], [PC.amber, 'Stint orange band'], [PC.vhigh, 'Stint red band']].forEach(it => { d.rect(lx, d.y + 2, 10, 7, it[0]); d.text(lx + 13, d.y + 8, it[1], {size:7.5, color:PC.mut}); lx += 13 + textW(it[1], 7.5) + 12; });
  d.diamond(lx + 3, d.y + 5.5, 3, PC.purple); d.text(lx + 9, d.y + 8, 'Through quarter break', {size:7.5, color:PC.mut}); lx += 9 + textW('Through quarter break', 7.5) + 12;
  d.circle(lx + 3, d.y + 5.5, 2.4, PC.orange); d.text(lx + 9, d.y + 8, 'Foul', {size:7.5, color:PC.mut}); lx += 40;
  d.rect(lx, d.y + 1, 1.8, 9, '#151515'); d.text(lx + 5, d.y + 8, 'Halftime (stints reset)', {size:7.5, color:PC.mut});
  d.y += 20;
}

/* ================= modal helpers ================= */
function openModal(html, noBgClose){ $('#modalRoot').innerHTML = '<div class="ov" ' + (noBgClose ? '' : 'data-a="ovClose"') + '><div class="modal" data-stop="1">' + html + '</div></div>'; }
function closeModal(){ $('#modalRoot').innerHTML = ''; }
ACT.closeModal = () => closeModal();
ACT.ovClose = (d, el, e) => { if(e.target === el) closeModal(); };
let confirmCb = null;
function openConfirm(title, text, label, cb){ confirmCb = cb; openModal('<h3>' + title + '</h3><div class="sub">' + text + '</div><div class="mact"><button class="btn" data-a="closeModal">Cancel</button><button class="btn danger" data-a="confirmYes">' + label + '</button></div>'); }
ACT.confirmYes = () => { const cb = confirmCb; confirmCb = null; closeModal(); if(cb) cb(); };

/* clock ticker: updates the clock text 4x/s; full live refresh every 10 s while running (skipped during a tap or an open dialog) */
let lpDown = false; document.addEventListener('pointerdown', () => { lpDown = true; }, true); document.addEventListener('pointerup', () => { lpDown = false; }, true);
let lastFull = 0;
setInterval(() => {
  if(A.route.name !== 'live') return; const g = curGame(); if(!g || !g.clk || !g.clk.run || !A.R) return;
  const el = $('#ckv'); if(el) el.textContent = fmtS(clkNow(g, A.R));
  if(Date.now() - lastFull > 10000 && !lpDown && !$('#modalRoot').innerHTML){ lastFull = Date.now(); renderLive(); }
}, 250);
/* ================= screen wake lock (keep iPad awake during games) ================= */
let wake = null;
async function manageWakeLock(){ if(A.route.name === 'live'){ try { if(!wake && navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); if(wake) wake.addEventListener('release', () => { wake = null; }); } catch(e) {} } else releaseWake(); }
function releaseWake(){ try { if(wake) wake.release(); } catch(e) {} wake = null; }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') manageWakeLock(); });

/* ================= boot ================= */
(async function boot(){
  await Store.init();
  try {
    const s = await Store.getKV('settings'); if(s) A.settings = Object.assign({}, DEFAULTS, s);
    A.settings.trackPoss = false; // live possession counting removed (30-oct): team possessions come from the box score
    A.metaUpdated = (await Store.getKV('metaUpdated')) || 0; A.tomb = (await Store.getKV('tomb')) || {};
    const r = await Store.getKV('roster'); if(Array.isArray(r)) A.roster = r;
    (await Store.allGames()).forEach(g => { A.games[g.id] = g; });
  } catch(e){ console.error(e); toast('Could not read saved data'); }
  render();
  Cloud.init();
  if('serviceWorker' in navigator && /^https?:/.test(location.protocol) && location.hostname !== 'localhost-nosw'){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
